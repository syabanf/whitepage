name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (api · edge · worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  web:
    name: Web (editor · renderer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here — action-setup@v4 reads it from package.json's
      # `packageManager` field (pnpm@9.12.0). Passing both errors on mismatch.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Editor typecheck
        run: pnpm --filter @cms/editor typecheck
      - name: Renderer typecheck
        run: pnpm --filter @cms/renderer typecheck
      - name: Renderer build
        run: pnpm --filter @cms/renderer build
